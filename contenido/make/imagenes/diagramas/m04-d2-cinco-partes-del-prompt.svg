<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Un prompt se divide en rol, contexto, tarea, restricciones y formato" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">Las cinco partes de un buen prompt</text><rect x="84" y="76" width="220" height="50" rx="10" fill="#ffeee6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="194" y="109" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">ROL</text><path d="M306 101 L340 101" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="350" y="109" font-size="23" text-anchor="start" fill="#2d3250" font-weight="400">quién es la IA</text><rect x="84" y="138" width="220" height="50" rx="10" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="194" y="171" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">CONTEXTO</text><path d="M306 163 L340 163" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="350" y="171" font-size="23" text-anchor="start" fill="#2d3250" font-weight="400">qué datos recibe y qué opciones existen</text><rect x="84" y="200" width="220" height="50" rx="10" fill="#efe8ff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="194" y="233" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">TAREA</text><path d="M306 225 L340 225" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="350" y="233" font-size="23" text-anchor="start" fill="#2d3250" font-weight="400">qué debe hacer, en una frase</text><rect x="84" y="262" width="220" height="50" rx="10" fill="#fff6d6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="194" y="295" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">RESTRICCIONES</text><path d="M306 287 L340 287" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="350" y="295" font-size="23" text-anchor="start" fill="#2d3250" font-weight="400">qué no debe hacer y cuándo dudar</text><rect x="84" y="324" width="220" height="50" rx="10" fill="#e6f1ff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="194" y="357" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">FORMATO</text><path d="M306 349 L340 349" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="350" y="357" font-size="23" text-anchor="start" fill="#2d3250" font-weight="400">cómo debe responder</text><text x="450" y="400" font-size="21" text-anchor="middle" fill="#5a4aa6" font-weight="400">Cada parte responde una pregunta distinta. Si falta una, la IA improvisa.</text></svg>
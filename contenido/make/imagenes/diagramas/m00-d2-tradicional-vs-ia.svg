<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Una regla fija decide siempre igual; un modelo de IA propone y se valida" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">Automatización tradicional y con IA</text><text x="450" y="88" font-size="26" text-anchor="middle" fill="#7b5fd6" font-weight="700">Tradicional: una regla fija decide</text><rect x="90" y="104" width="190" height="62" rx="12" fill="#fff6d6" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="185" y="142" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">Prioridad: Alta</text><path d="M280 135 L350 135" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="350" y="104" width="200" height="62" rx="12" fill="#f4efff" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="450" y="130" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Si es Alta,</text><text x="450" y="154" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">va a Urgentes</text><path d="M550 135 L620 135" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="620" y="104" width="190" height="62" rx="12" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="715" y="142" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">Hoja Urgentes</text><text x="450" y="204" font-size="22" text-anchor="middle" fill="#5a4aa6" font-weight="400">Mismo dato, mismo resultado, siempre.</text><text x="450" y="262" font-size="26" text-anchor="middle" fill="#1f8f5f" font-weight="700">Con IA: un modelo propone</text><rect x="90" y="276" width="190" height="62" rx="12" fill="#fff6d6" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="185" y="302" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Texto libre:</text><text x="185" y="328" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">no puedo entrar</text><path d="M280 307 L330 307" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="330" y="276" width="240" height="62" rx="12" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="450" y="302" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">El modelo propone</text><text x="450" y="328" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">categoría y prioridad</text><path d="M570 307 L620 307" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="620" y="276" width="190" height="62" rx="12" fill="#f4efff" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><text x="715" y="302" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Una regla o una</text><text x="715" y="328" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">persona valida</text><text x="450" y="384" font-size="22" text-anchor="middle" fill="#1f8f5f" font-weight="400">Puede equivocarse: por eso se revisa lo importante.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Una solicitud llega a un Router que la envía por la ruta cuyo filtro coincide; la ruta de reserva recibe lo que no coincide" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">Un Router reparte los datos por rutas</text><rect x="70" y="170" width="170" height="70" rx="10" fill="#fff6d6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="155" y="200" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">Llega una</text><text x="155" y="228" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">solicitud</text><path d="M240 205 L330 205" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><circle cx="385" cy="205" r="56" fill="#a8e2c0" stroke="#2d3250" stroke-width="2.8"/><text x="385" y="211" font-size="26" text-anchor="middle" fill="#2d3250" font-weight="700">Router</text><path d="M435 190 L520 118" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="524" y="90" width="190" height="56" rx="10" fill="#ffeee6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="619" y="114" font-size="19" text-anchor="middle" fill="#c0562d" font-weight="400">filtro:</text><text x="619" y="136" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="400">Prioridad = Alta</text><path d="M716 118 L770 118" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="774" y="96" width="110" height="44" rx="10" fill="#ffffff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="829" y="126" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="700">Urgentes</text><path d="M435 205 L520 218" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="524" y="190" width="190" height="56" rx="10" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="619" y="214" font-size="19" text-anchor="middle" fill="#1f8f5f" font-weight="400">filtro:</text><text x="619" y="236" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="400">Prioridad = Normal</text><path d="M716 218 L770 218" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="774" y="196" width="110" height="44" rx="10" fill="#ffffff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="829" y="226" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="700">Normales</text><path d="M435 225 L520 318" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="524" y="290" width="190" height="56" rx="10" fill="#f4efff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="619" y="314" font-size="19" text-anchor="middle" fill="#7b5fd6" font-weight="400">filtro:</text><text x="619" y="336" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="400">ninguna coincide</text><path d="M716 318 L770 318" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="774" y="296" width="110" height="44" rx="10" fill="#ffffff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="829" y="326" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="700">Pendientes</text><text x="619" y="362" font-size="21" text-anchor="middle" fill="#7b5fd6" font-weight="400">La última es la ruta de reserva (fallback):</text><text x="619" y="390" font-size="21" text-anchor="middle" fill="#7b5fd6" font-weight="400">solo actúa si ninguna otra coincidió.</text></svg>
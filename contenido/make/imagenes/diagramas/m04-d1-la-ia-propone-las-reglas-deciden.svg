<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Una solicitud pasa por Groq, Parse JSON y un Router que la envía a Urgentes, Normales o Revisión humana" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">La IA propone y las reglas deciden</text><rect x="72" y="150" width="130" height="70" rx="10" fill="#fff6d6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="137" y="178" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">Solicitud</text><text x="137" y="204" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">escrita</text><path d="M204 185 L262 185" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><circle cx="318" cy="185" r="52" fill="#ffd9c9" stroke="#2d3250" stroke-width="2.8"/><text x="318" y="180" font-size="26" text-anchor="middle" fill="#2d3250" font-weight="700">Groq</text><text x="318" y="205" font-size="20" text-anchor="middle" fill="#2d3250" font-weight="400">(la IA)</text><path d="M372 185 L430 185" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="434" y="150" width="120" height="70" rx="10" fill="#efe8ff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="494" y="178" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">Parse</text><text x="494" y="204" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="400">JSON</text><path d="M556 185 L606 185" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><circle cx="652" cy="185" r="46" fill="#a8e2c0" stroke="#2d3250" stroke-width="2.8"/><text x="652" y="191" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="700">Router</text><path d="M700 175 L748 112" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="752" y="90" width="140" height="46" rx="10" fill="#ffeee6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="822" y="120" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="700">Urgentes</text><path d="M700 185 L748 192" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="752" y="170" width="140" height="46" rx="10" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="822" y="200" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="700">Normales</text><path d="M700 205 L748 272" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><rect x="752" y="250" width="140" height="46" rx="10" fill="#f4efff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="822" y="280" font-size="15" text-anchor="middle" fill="#2d3250" font-weight="700">Revisión humana</text><text x="318" y="262" font-size="21" text-anchor="middle" fill="#c0562d" font-weight="400">propone</text><text x="494" y="262" font-size="21" text-anchor="middle" fill="#5a4aa6" font-weight="400">ordena</text><text x="656" y="262" font-size="21" text-anchor="middle" fill="#1f8f5f" font-weight="400">decide</text><text x="450" y="345" font-size="22" text-anchor="middle" fill="#5a4aa6" font-weight="400">La IA solo sugiere una clasificación. Las reglas del Router</text><text x="450" y="375" font-size="22" text-anchor="middle" fill="#5a4aa6" font-weight="400">deciden a dónde va cada solicitud, y una persona revisa lo dudoso.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Una solicitud que cumple los filtros de dos rutas se procesa por las dos" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">Un Router no es un si / si no</text><text x="450" y="84" font-size="26" text-anchor="middle" fill="#c0562d" font-weight="700">Una solicitud Alta que menciona «factura»</text><rect x="60" y="150" width="150" height="60" rx="10" fill="#fff6d6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="135" y="176" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">SOL-105</text><text x="135" y="200" font-size="20" text-anchor="middle" fill="#2d3250" font-weight="400">Alta, factura</text><path d="M210 180 L300 180" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><circle cx="350" cy="180" r="48" fill="#a8e2c0" stroke="#2d3250" stroke-width="2.8"/><text x="350" y="186" font-size="24" text-anchor="middle" fill="#2d3250" font-weight="700">Router</text><path d="M396 164 L500 120" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><path d="M396 196 L500 236" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="504" y="92" width="200" height="56" rx="10" fill="#ffeee6" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="604" y="118" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">ruta Urgentes</text><text x="604" y="140" font-size="19" text-anchor="middle" fill="#1f8f5f" font-weight="400">Alta: SÍ coincide</text><rect x="504" y="208" width="200" height="56" rx="10" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="604" y="234" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">ruta Normales</text><text x="604" y="256" font-size="19" text-anchor="middle" fill="#1f8f5f" font-weight="400">«factura»: SÍ coincide</text><path d="M706 120 L760 120" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="764" y="100" width="120" height="44" rx="10" fill="#fff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="824" y="129" font-size="20" text-anchor="middle" fill="#2d3250" font-weight="400">fila nueva</text><path d="M706 236 L760 236" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none"  marker-end="url(#p)"/><rect x="764" y="216" width="120" height="44" rx="10" fill="#fff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="824" y="245" font-size="20" text-anchor="middle" fill="#2d3250" font-weight="400">fila nueva</text><text x="450" y="322" font-size="24" text-anchor="middle" fill="#5a4aa6" font-weight="400">Si varios filtros coinciden, se ejecutan varias rutas:</text><text x="450" y="354" font-size="24" text-anchor="middle" fill="#5a4aa6" font-weight="400">la misma solicitud se escribe dos veces.</text><text x="450" y="392" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Por eso los filtros de un Router se diseñan con cuidado.</text></svg>
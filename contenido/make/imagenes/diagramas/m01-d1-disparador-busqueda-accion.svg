"middle" fill="#2d3250" font-weight="700">Disparador</text><text x="190" y="262" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Avisa que hay</text><text x="190" y="290" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">algo nuevo</text><text x="190" y="322" font-size="20" text-anchor="middle" fill="#5a4aa6" font-weight="400">Ej: llegó una fila</text><rect x="330" y="90" width="240" height="250" rx="12" fill="#f4efff" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><circle cx="450" cy="156" r="38" fill="#ffffff" stroke="#2d3250" stroke-width="2.8"/><text x="450" y="168" font-size="38" text-anchor="middle" fill="#2d3250" font-weight="700">?</text><text x="450" y="226" font-size="30" text-anchor="middle" fill="#2d3250" font-weight="700">Búsqueda</text><text x="450" y="262" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Va a buscar</text><text x="450" y="290" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">datos y los trae</text><text x="450" y="322" font-size="20" text-anchor="middle" fill="#5a4aa6" font-weight="400">Ej: buscar una fila</text><rect x="590" y="90" width="240" height="250" rx="12" fill="#e8f8ef" stroke="#2d3250" stroke-width="2.6" stroke-linejoin="round"/><circle cx="710" cy="156" r="38" fill="#ffffff" stroke="#2d3250" stroke-width="2.8"/><text x="710" y="168" font-size="38" text-anchor="middle" fill="#2d3250" font-weight="700">ok</text><text x="710" y="226" font-size="30" text-anchor="middle" fill="#2d3250" font-weight="700">Acción</text><text x="710" y="262" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Hace un cambio:</text><text x="710" y="290" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">guarda o envía</text><text x="710" y="322" font-size="20" text-anchor="middle" fill="#5a4aa6" font-weight="400">Ej: agregar una fila</text><text x="450" y="384" font-size="22" text-anchor="middle" fill="#2d3250" font-weight="400">Un escenario suele empezar con uno que avisa y seguir con los que actúan.</text></svg>
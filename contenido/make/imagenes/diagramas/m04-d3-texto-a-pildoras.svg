<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Parse JSON convierte el texto de la respuesta en píldoras separables" font-family="Caveat, 'Comic Sans MS', 'Segoe Print', cursive" font-size="26" fill="#2d3250"><defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2d3250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdf6"/><line x1="0" y1="56" x2="900" y2="56" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="88" x2="900" y2="88" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="120" x2="900" y2="120" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="152" x2="900" y2="152" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="184" x2="900" y2="184" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="216" x2="900" y2="216" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="248" x2="900" y2="248" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="280" x2="900" y2="280" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="312" x2="900" y2="312" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="344" x2="900" y2="344" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="376" x2="900" y2="376" stroke="#d8e4f2" stroke-width="1.5"/><line x1="0" y1="408" x2="900" y2="408" stroke="#d8e4f2" stroke-width="1.5"/><line x1="56" y1="0" x2="56" y2="420" stroke="#f1a9a9" stroke-width="2"/><text x="450" y="44" font-size="34" text-anchor="middle" fill="#2d3250" font-weight="700">De un texto con forma de JSON a píldoras</text><rect x="70" y="100" width="310" height="120" rx="10" fill="#fff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="225" y="130" font-size="21" text-anchor="middle" fill="#c0562d" font-weight="700">Lo que entrega Groq</text><text x="225" y="164" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="400">un solo texto largo:</text><text x="225" y="194" font-size="19" text-anchor="middle" fill="#7b5fd6" font-weight="400">{"categoria":"Soporte", ...}</text><path d="M384 160 L506 160" stroke="#2d3250" stroke-width="2.8" stroke-linecap="round" fill="none" marker-end="url(#p)"/><text x="445" y="146" font-size="21" text-anchor="middle" fill="#2d3250" font-weight="700">Parse JSON</text><rect x="512" y="76" width="340" height="168" rx="10" fill="#efe8ff" stroke="#2d3250" stroke-width="2.4" stroke-linejoin="round"/><text x="672" y="106" font-size="21" text-anchor="middle" fill="#5a4aa6" font-weight="700">Lo que ves después</text><rect x="540" y="122" width="130" height="38" rx="10" fill="#d9c8ff" stroke="#7b5fd6" stroke-width="2.4" stroke-linejoin="round"/><text x="605" y="148" font-size="18" text-anchor="middle" fill="#2d3250" font-weight="400">Categoria</text><rect x="680" y="122" width="130" height="38" rx="10" fill="#d9c8ff" stroke="#7b5fd6" stroke-width="2.4" stroke-linejoin="round"/><text x="745" y="148" font-size="18" text-anchor="middle" fill="#2d3250" font-weight="400">Prioridad</text><rect x="540" y="174" width="130" height="38" rx="10" fill="#d9c8ff" stroke="#7b5fd6" stroke-width="2.4" stroke-linejoin="round"/><text x="605" y="200" font-size="18" text-anchor="middle" fill="#2d3250" font-weight="400">Resumen</text><rect x="680" y="174" width="170" height="38" rx="10" fill="#d9c8ff" stroke="#7b5fd6" stroke-width="2.4" stroke-linejoin="round"/><text x="765" y="200" font-size="18" text-anchor="middle" fill="#2d3250" font-weight="400">Requiere revision</text><text x="450" y="300" font-size="23" text-anchor="middle" fill="#5a4aa6" font-weight="400">Sin Parse JSON el texto no se puede separar en piezas.</text><text x="450" y="336" font-size="23" text-anchor="middle" fill="#5a4aa6" font-weight="400">Con Parse JSON cada dato es una píldora que puedes mapear o filtrar.</text><text x="450" y="376" font-size="21" text-anchor="middle" fill="#c0562d" font-weight="400">Requiere revision es booleano: solo puede valer verdadero o falso.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="tt dd">
<title id="tt">Elementos de modelamiento de procesos BPMN</title>
<desc id="dd">Lámina ilustrada en español organizada en contenedores, elementos del flujo y conexiones: pool, carril, evento de inicio, evento de fin, actividad, compuerta exclusiva, flujo de secuencia, flujo de mensaje y asociación.</desc>
<defs>
<style>
.bg{fill:#ffffff}.panel{fill:#f8fafc;stroke:#d5e0ec;stroke-width:2}.sub{font:600 16px Arial,sans-serif;fill:#39708c;letter-spacing:2px}.big{font:700 27px Arial,sans-serif;fill:#19394f}.name{font:700 20px Arial,sans-serif;fill:#1d3f58}.explain{font:16px Arial,sans-serif;fill:#556d80}.fig{stroke:#216b98;stroke-width:3;fill:#ecf5fc}.fine{stroke:#216b98;stroke-width:3;fill:none}.inner{font:16px Arial,sans-serif;fill:#244b69}.marker{fill:#216b98}.line{stroke:#216b98;stroke-width:4;fill:none;stroke-linecap:round}.small{font:15px Arial,sans-serif;fill:#244b69}
</style>
<marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#216b98"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#216b98" stroke-width="1.6"/></marker>
</defs>
<rect class="bg" width="1200" height="1200"/>
<text class="sub" x="38" y="47">GUÍA VISUAL · NOTACIÓN BPMN</text>
<text class="big" x="38" y="86">Simbología para modelar procesos</text>

<text class="big" x="38" y="144">01  Contenedores y responsables</text>
<rect class="panel" x="38" y="164" width="548" height="245" rx="15"/>
<text class="name" x="65" y="198">Pool · Participante</text>
<rect class="fig" x="75" y="230" width="470" height="119" rx="2"/>
<line class="fine" x1="131" y1="230" x2="131" y2="349"/>
<text class="inner" x="106" y="289" text-anchor="middle" transform="rotate(-90 106 289)">Participante</text>
<text class="explain" x="65" y="383">Delimita a un participante del proceso.</text>
<rect class="panel" x="614" y="164" width="548" height="245" rx="15"/>
<text class="name" x="641" y="198">Carriles · Responsables</text>
<rect class="fig" x="651" y="230" width="470" height="119" rx="2"/>
<line class="fine" x1="711" y1="230" x2="711" y2="349"/>
<line class="fine" x1="651" y1="289.5" x2="1121" y2="289.5"/>
<text class="inner" x="680" y="260" text-anchor="middle" transform="rotate(-90 680 260)">Persona</text>
<text class="inner" x="680" y="322" text-anchor="middle" transform="rotate(-90 680 322)">Sistema</text>
<text class="explain" x="641" y="383">Dividen el participante por responsable.</text>

<text class="big" x="38" y="470">02  Elementos del proceso</text>
<rect class="panel" x="38" y="490" width="548" height="238" rx="15"/>
<text class="name" x="65" y="527">Eventos</text>
<circle class="fig" cx="188" cy="609" r="38"/>
<circle class="fig" cx="430" cy="609" r="38" stroke-width="7"/>
<text class="small" x="188" y="676" text-anchor="middle">Inicio</text>
<text class="small" x="430" y="676" text-anchor="middle">Fin</text>
<rect class="panel" x="614" y="490" width="260" height="238" rx="15"/>
<text class="name" x="639" y="527">Actividad</text>
<rect class="fig" x="644" y="578" width="200" height="63" rx="14"/>
<text class="small" x="744" y="615" text-anchor="middle">Revisar datos</text>
<text class="explain" x="639" y="693">Tarea ejecutada</text>
<rect class="panel" x="902" y="490" width="260" height="238" rx="15"/>
<text class="name" x="927" y="527">Compuerta</text>
<path class="fig" d="M1032 557 L1088 609 L1032 661 L976 609 Z"/>
<path class="fine" d="M1018 595 L1046 623 M1046 595 L1018 623"/>
<text class="explain" x="927" y="693">Decisión exclusiva</text>

<text class="big" x="38" y="787">03  Tipos de conexiones</text>
<rect class="panel" x="38" y="809" width="1124" height="300" rx="15"/>
<text class="name" x="75" y="864">Flujo de secuencia</text>
<path class="line" d="M480 853 H1048" marker-end="url(#arrow-solid)"/>
<text class="explain" x="75" y="894">Línea continua con flecha sólida: orden de actividades dentro del proceso.</text>
<line x1="75" y1="916" x2="1125" y2="916" stroke="#d6e1eb" stroke-width="2"/>
<text class="name" x="75" y="962">Flujo de mensaje</text>
<circle cx="491" cy="948" r="7" fill="#ffffff" stroke="#216b98" stroke-width="3"/>
<path class="line" d="M500 948 H1048" stroke-dasharray="13 10" marker-end="url(#arrow-open)"/>
<text class="explain" x="75" y="994">Línea discontinua con extremo abierto: mensajes entre participantes.</text>
<line x1="75" y1="1015" x2="1125" y2="1015" stroke="#d6e1eb" stroke-width="2"/>
<text class="name" x="75" y="1060">Asociación</text>
<path class="line" d="M480 1047 H1048" stroke-dasharray="2 11" stroke-width="3"/>
<text class="explain" x="75" y="1091">Línea punteada: relaciona información o anotaciones con elementos.</text>
<text class="explain" x="38" y="1156">Esquema introductorio; cada elemento tiene variantes y reglas de uso adicionales.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Simbología básica para el modelamiento de procesos</title><desc id="descripcion">Eventos circulares de inicio y fin, actividad con rectángulo redondeado, compuerta en rombo y carriles que separan responsables.</desc><style>.title{font:700 22px Arial,sans-serif;fill:#18354e}.label{font:600 17px Arial,sans-serif;fill:#25465f}.detail{font:15px Arial,sans-serif;fill:#506276}.symbol{fill:#e9f4fc;stroke:#2379a6;stroke-width:3}.panel{fill:#f7fafc;stroke:#d2dfea;stroke-width:1.5}</style><rect width="1060" height="620" rx="18" fill="#fff"/><g><rect class="panel" x="24" y="20" width="498" height="210" rx="14"/><text class="title" x="50" y="60">1. Eventos</text><circle class="symbol" cx="158" cy="129" r="37"/><circle class="symbol" cx="362" cy="129" r="37" stroke-width="6"/><text class="label" x="158" y="188" text-anchor="middle">Inicio</text><text class="label" x="362" y="188" text-anchor="middle">Fin</text><text class="detail" x="50" y="214">Indican cuándo comienza y termina el proceso.</text></g><g><rect class="panel" x="538" y="20" width="498" height="210" rx="14"/><text class="title" x="564" y="60">2. Actividades</text><rect class="symbol" x="668" y="95" width="235" height="72" rx="16"/><text class="label" x="785" y="138" text-anchor="middle">Revisar solicitud</text><text class="detail" x="564" y="214">Representan una tarea que se ejecuta.</text></g><g><rect class="panel" x="24" y="247" width="498" height="210" rx="14"/><text class="title" x="50" y="287">3. Compuertas</text><path class="symbol" d="M269 305 L337 370 L269 435 L201 370 Z"/><path d="M253 354 L285 386 M285 354 L253 386" stroke="#2379a6" stroke-width="4"/><text class="detail" x="50" y="445">Permiten bifurcar el flujo según una condición.</text></g><g><rect class="panel" x="538" y="247" width="498" height="210" rx="14"/><text class="title" x="564" y="287">4. Carriles</text><rect x="579" y="314" width="414" height="103" fill="#e9f4fc" stroke="#2379a6" stroke-width="2"/><path d="M579 365 H993 M697 314 V417" stroke="#2379a6" stroke-width="2"/><text class="label" x="638" y="347" text-anchor="middle">Persona</text><text class="label" x="638" y="400" text-anchor="middle">Sistema</text><rect x="758" y="325" width="170" height="29" rx="8" fill="#fff" stroke="#2379a6"/><rect x="758" y="379" width="170" height="29" rx="8" fill="#fff" stroke="#2379a6"/><text x="843" y="345" text-anchor="middle" font-family="Arial" font-size="13" fill="#25465f">Enviar solicitud</text><text x="843" y="399" text-anchor="middle" font-family="Arial" font-size="13" fill="#25465f">Registrar datos</text><text class="detail" x="564" y="445">Separan actividades por responsable.</text></g><text class="detail" x="530" y="515" text-anchor="middle">Representación didáctica de cuatro elementos básicos de la notación BPMN.</text></svg>
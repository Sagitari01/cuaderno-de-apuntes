<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="Postman por HTTPS llega al túnel, que reenvía al proxy local 8092. Solo el POST autorizado llega al webhook n8n. El editor local no está expuesto."><rect width="1100" height="350" rx="16" fill="#f5f7fa"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#345570"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="#152f42"><text x="550" y="36" font-size="22" font-weight="bold">Un receptor público, un editor privado</text><g fill="#fff" stroke="#345570" stroke-width="2"><rect x="25" y="86" width="175" height="90" rx="10"/><rect x="265" y="86" width="190" height="90" rx="10"/><rect x="520" y="86" width="235" height="90" rx="10"/><rect x="820" y="86" width="255" height="90" rx="10"/><rect x="820" y="238" width="255" height="70" rx="10" stroke-dasharray="6 5"/></g><g font-size="17" font-weight="bold"><text x="112" y="121">Postman</text><text x="360" y="121">Túnel HTTPS</text><text x="637" y="121">Proxy local</text><text x="947" y="121">Webhook n8n</text><text x="947" y="269">Editor local</text></g><g font-size="14"><text x="112" y="146">POST + token</text><text x="360" y="146">Cloudflare Quick Tunnel</text><text x="637" y="146">127.0.0.1:8092</text><text x="947" y="146">Header Auth + workflow</text><text x="947" y="290">localhost:5682</text></g><g stroke="#345570" stroke-width="3" marker-end="url(#a)"><path d="M200 131H261"/><path d="M455 131H516"/><path d="M755 131H816"/></g><text x="637" y="205" font-size="14">Solo POST en la ruta exacta</text><text x="637" y="227" font-size="14" fill="#9e2830">Otras rutas → 404</text><text x="947" y="226" font-size="14" fill="#9e2830">Sin ruta desde el túnel</text><text x="550" y="331" font-size="13" fill="#45647a">Diagrama conceptual del laboratorio: HTTPS en el tramo público, HTTP en el destino local.</text></g></svg>
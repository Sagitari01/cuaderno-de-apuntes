<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagrama BPMN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bpmn-js@17.11.1/dist/assets/diagram-js.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bpmn-js@17.11.1/dist/assets/bpmn-js.css">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Arial,sans-serif}
#lienzo{position:absolute;inset:0}
body.fijo #lienzo{pointer-events:none}
#msg{position:absolute;top:12px;left:12px;color:#b00020;font-size:14px}
#barra{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;font-size:13px;color:#4a5560}
#barra button{width:36px;height:36px;border:1px solid #c3ccd4;background:#fff;color:#1d3f58;font-size:18px;cursor:pointer}
#barra button.txt{width:auto;padding:0 12px;font-size:13px}
#barra button:hover{background:#eef3f7}
#ayuda{margin-right:8px}
body.fijo #barra{display:none}
.bjs-powered-by{display:none}
</style>
</head>
<body>
<div id="lienzo"></div>
<div id="msg"></div>
<div id="barra">
  <span id="ayuda">Arrastra para mover · rueda para acercar</span>
  <button id="menos" aria-label="Alejar">−</button>
  <button id="mas" aria-label="Acercar">+</button>
  <button id="ajustar" class="txt">Ver todo</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bpmn-js@17.11.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = params.get('src') || '';
  var fijo = params.get('fijo') === '1';
  var msg = document.getElementById('msg');
  var lienzo = document.getElementById('lienzo');
  if (fijo) document.body.className = 'fijo';
  if (!/^[\w-]+\.bpmn$/.test(src)) { msg.textContent = 'Falta el diagrama a mostrar.'; return; }
  var viewer = new BpmnJS({ container: '#lienzo' });
  var canvas = viewer.get('canvas');
  function ajustar() {
    if (!lienzo.clientWidth || !lienzo.clientHeight) return;
    canvas.resized();
    canvas.zoom('fit-viewport', 'auto');
  }
  fetch(src).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (xml) { return viewer.importXML(xml); })
    .then(function () { ajustar(); var t; new ResizeObserver(function () { clearTimeout(t); t = setTimeout(function () { ajustar(); setTimeout(ajustar, 300); }, 120); }).observe(lienzo); })
    .catch(function () { msg.textContent = 'No se pudo cargar el diagrama.'; });
  document.getElementById('mas').onclick = function () { canvas.zoom(canvas.zoom() * 1.25); };
  document.getElementById('menos').onclick = function () { canvas.zoom(canvas.zoom() / 1.25); };
  document.getElementById('ajustar').onclick = function () { canvas.zoom('fit-viewport', 'auto'); };
  window.visorBpmn = viewer;
})();
</script>
</body>
</html>

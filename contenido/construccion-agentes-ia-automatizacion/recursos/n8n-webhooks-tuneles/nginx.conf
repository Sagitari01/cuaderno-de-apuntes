server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;

    # Solo el receptor de producción de este ejercicio, no el editor,
    # la API REST, las rutas de prueba ni otros webhooks.
    location = /webhook/biblioteca-evento-protegido {
        if ($request_method != POST) { return 405; }
        proxy_pass http://n8n:5678/webhook/biblioteca-evento-protegido;
        proxy_http_version 1.1;
        proxy_set_header Host n8n:5678;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / { return 404; }
}

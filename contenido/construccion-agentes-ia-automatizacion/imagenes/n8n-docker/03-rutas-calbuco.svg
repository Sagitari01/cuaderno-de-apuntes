<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title description"><title id="title">Cómo se decide el estado</title><desc id="description">Si falta el monto el caso va a contingencia; si supera 500.000 va a pendiente; en los demás casos del ejemplo se aprueba.</desc><defs><pattern id="rules" width="920" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H920" stroke="#b6cde1" stroke-opacity=".64"/></pattern><marker id="pencil-arrow" markerWidth="11" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M2 1L8 4 2 7" fill="none" stroke="#233e63" stroke-width="1.4"/></marker></defs><rect width="920" height="510" rx="14" fill="#fffaf0"/><rect width="920" height="510" rx="14" fill="url(#rules)"/><path d="M68 0V510" stroke="#d98b8e" stroke-width="2" stroke-opacity=".65"/><circle cx="31" cy="89" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="253" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="416" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><path d="M91 91q228 3 450-1" stroke="#edc86f" stroke-width="11" fill="none" stroke-linecap="round" opacity=".66"/><text x="90" y="85" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#233e63">Cómo se decide el estado</text><text x="92" y="129" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">Calbuco · Regla del ejemplo: $500.000 CLP</text><rect x="94" y="193" width="215" height="83" rx="12" fill="#eff6fc" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 201.5 234.5)"/><text x="109" y="224" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">¿Hay monto?</text><text x="109" y="251" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Primer If</text><path d="M312 235H369" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><text x="329" y="222" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#233e63">Sí</text><rect x="375" y="193" width="230" height="83" rx="12" fill="#fff3d5" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 490 234.5)"/><text x="390" y="224" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">¿Supera $500.000?</text><text x="390" y="251" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Segundo If</text><path d="M608 212H639V180H669" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><text x="641" y="169" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#233e63">Sí</text><rect x="675" y="143" width="190" height="77" rx="12" fill="#fff1d5" stroke="#855c2f" stroke-width="2" transform="rotate(-0.4 770 181.5)"/><text x="690" y="174" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#855c2f">Pendiente</text><text x="690" y="201" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#855c2f">$1.250.000</text><path d="M608 253H639V301H669" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><text x="641" y="290" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#233e63">No</text><rect x="675" y="265" width="190" height="90" rx="12" fill="#edf5e9" stroke="#3f725c" stroke-width="2" transform="rotate(-0.4 770 310)"/><text x="690" y="296" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#3f725c">Aprobado</text><text x="690" y="323" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#3f725c">$320.000</text><text x="690" y="350" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#3f725c">$500.000</text><path d="M198 280V379H321" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><text x="212" y="366" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#233e63">No</text><rect x="327" y="343" width="255" height="78" rx="12" fill="#fbebe9" stroke="#9d4247" stroke-width="2" transform="rotate(-0.4 454.5 382)"/><text x="342" y="374" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#9d4247">Contingencia</text><text x="342" y="401" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#9d4247">Monto ausente</text><text x="92" y="475" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">El monto exacto del límite también se aprueba.</text></svg>

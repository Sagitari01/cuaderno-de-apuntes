<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title description"><title id="title">Qué hace Docker</title><desc id="description">La imagen proporciona el software, Docker lo ejecuta como contenedor y el volumen guarda los datos.</desc><defs><pattern id="rules" width="920" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H920" stroke="#b6cde1" stroke-opacity=".64"/></pattern><marker id="pencil-arrow" markerWidth="11" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M2 1L8 4 2 7" fill="none" stroke="#233e63" stroke-width="1.4"/></marker></defs><rect width="920" height="510" rx="14" fill="#fffaf0"/><rect width="920" height="510" rx="14" fill="url(#rules)"/><path d="M68 0V510" stroke="#d98b8e" stroke-width="2" stroke-opacity=".65"/><circle cx="31" cy="89" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="253" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="416" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><path d="M91 91q228 3 450-1" stroke="#edc86f" stroke-width="11" fill="none" stroke-linecap="round" opacity=".66"/><text x="90" y="85" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#233e63">Qué hace Docker</text><text x="92" y="129" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">Tu navegador abre n8n en el mismo equipo.</text><rect x="93" y="207" width="221" height="88" rx="12" fill="#eff6fc" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 203.5 251)"/><text x="108" y="238" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Navegador</text><text x="108" y="265" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Abre n8n por el puerto</text><path d="M317 251 Q338 248 358 251" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="364" y="207" width="218" height="88" rx="12" fill="#fff3d5" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 473 251)"/><text x="379" y="238" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Contenedor</text><text x="379" y="265" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Ejecuta n8n</text><path d="M585 251 Q606 253 626 251" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="632" y="207" width="212" height="88" rx="12" fill="#edf5e9" stroke="#3f725c" stroke-width="2" transform="rotate(-0.4 738 251)"/><text x="647" y="238" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#3f725c">Volumen</text><text x="647" y="265" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#3f725c">Conserva los datos</text><text x="367" y="167" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#233e63">Imagen de n8n</text><path d="M472 173V200" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="273" y="362" width="411" height="76" rx="12" fill="#fbf3ff" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 478.5 400)"/><text x="288" y="393" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Docker Compose</text><text x="288" y="420" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Define cómo se inicia el servicio</text><path d="M473 357V302" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><text x="93" y="478" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">El volumen permanece si se recrea el contenedor.</text></svg>

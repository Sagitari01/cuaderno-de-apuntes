<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title description"><title id="title">Cómo viajan los datos</title><desc id="description">Un disparador inicia una ejecución. El siguiente nodo produce cuatro ítems y un If evalúa cada monto.</desc><defs><pattern id="rules" width="920" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H920" stroke="#b6cde1" stroke-opacity=".64"/></pattern><marker id="pencil-arrow" markerWidth="11" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M2 1L8 4 2 7" fill="none" stroke="#233e63" stroke-width="1.4"/></marker></defs><rect width="920" height="510" rx="14" fill="#fffaf0"/><rect width="920" height="510" rx="14" fill="url(#rules)"/><path d="M68 0V510" stroke="#d98b8e" stroke-width="2" stroke-opacity=".65"/><circle cx="31" cy="89" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="253" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><circle cx="31" cy="416" r="9" fill="#e4d9c7" stroke="#cdbfa7"/><path d="M91 91q228 3 450-1" stroke="#edc86f" stroke-width="11" fill="none" stroke-linecap="round" opacity=".66"/><text x="90" y="85" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#233e63">Cómo viajan los datos</text><text x="92" y="130" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">Un ítem es un documento con sus datos.</text><rect x="93" y="176" width="218" height="90" rx="12" fill="#fff3d5" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 202 221)"/><text x="108" y="207" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Disparador</text><text x="108" y="234" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Inicia el flujo</text><path d="M314 221 Q335 219 351 221" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="355" y="176" width="218" height="90" rx="12" fill="#eff6fc" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 464 221)"/><text x="370" y="207" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Nodo de datos</text><text x="370" y="234" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">Entrega 4 ítems</text><path d="M576 221 Q597 223 613 221" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="617" y="176" width="217" height="90" rx="12" fill="#edf5e9" stroke="#3f725c" stroke-width="2" transform="rotate(-0.4 725.5 221)"/><text x="632" y="207" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#3f725c">Nodo If</text><text x="632" y="234" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#3f725c">Revisa cada monto</text><path d="M465 271 Q474 306 500 324" fill="none" stroke="#233e63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pencil-arrow)"/><rect x="213" y="330" width="575" height="93" rx="12" fill="#fbf3ff" stroke="#233e63" stroke-width="2" transform="rotate(-0.4 500.5 376.5)"/><text x="228" y="361" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#233e63">Ejemplo de un ítem</text><text x="228" y="388" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#233e63">OC-9102  ·  Monto: $320.000 CLP</text><text x="93" y="472" font-family="Segoe Print, Bradley Hand, cursive" font-size="21" font-weight="500" fill="#466488">Una ejecución puede procesar varios ítems.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640"><defs><pattern id="ruled" width="1020" height="36" patternUnits="userSpaceOnUse"><line x1="0" y1="35" x2="1020" y2="35" stroke="#b8d5f4" stroke-width="1.5"/></pattern></defs><rect width="1020" height="640" fill="#fffefa"/><rect width="1020" height="640" fill="url(#ruled)"/><path d="M82 0V640" stroke="#f2a0a6" stroke-width="2.5"/><circle cx="23" cy="80" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="150" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="220" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="290" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="360" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="430" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="500" r="11" fill="#e8e9eb" stroke="#bbb"/><circle cx="23" cy="570" r="11" fill="#e8e9eb" stroke="#bbb"/><rect x="128" y="20" width="790" height="70" rx="21" fill="#d8eaf9" opacity=".8"/><text x="147" y="68" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="38">Alucinaciones, sesgos y controles</text><rect x="127" y="127" width="410" height="440" rx="16" fill="#fff0f0" stroke="#295792" stroke-width="2.5"/><text x="148" y="173" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="27">ALUCINACIÓN</text><rect x="565" y="127" width="407" height="440" rx="16" fill="#fff9e7" stroke="#295792" stroke-width="2.5"/><text x="586" y="173" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="27">SESGO</text><text x="151" y="224" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="26">Dato sin respaldo</text><text x="588" y="224" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="25">Distorsión sistemática</text><text x="151" y="294" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">Mensaje: «No indica cantidad».</text><text x="151" y="332" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">IA inventa: 30 asistentes.</text><text x="151" y="383" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">Problema: cifra no verificada.</text><text x="588" y="294" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">Dos solicitudes similares</text><text x="588" y="332" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">reciben trato desigual</text><text x="588" y="383" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">por rasgos irrelevantes.</text><rect x="129" y="465" width="842" height="91" rx="16" fill="#e7f7eb" stroke="#295792" stroke-width="2.5"/><text x="153" y="507" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="750" font-size="23">Controles: fuente confiable + reglas + validación + revisión humana</text><text x="142" y="602" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="21">Temperatura baja no garantiza información correcta.</text></svg>
00" font-size="22">Instrucción:</text><text x="153" y="326" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="21">Clasifica este mensaje</text><text x="153" y="358" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="21">como consulta o reclamo.</text><text x="587" y="289" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="22">Instrucción + ejemplos:</text><text x="587" y="326" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">«¿A qué hora?» → consulta</text><text x="587" y="358" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">«Llegó roto» → reclamo</text><text x="153" y="431" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="20">Nuevo mensaje:</text><text x="153" y="466" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">«¿Tienen sala libre?»</text><text x="587" y="431" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="20">Nuevo mensaje:</text><text x="587" y="466" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="20">«¿Tienen sala libre?»</text><text x="153" y="514" fill="#176e42" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="21">Respuesta: consulta</text><text x="587" y="514" fill="#176e42" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="21">Respuesta: consulta</text><text x="133" y="596" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="23">Ambas técnicas deben probarse y validarse.</text></svg>
 Arial, sans-serif" font-weight="800" font-size="22">TAREA</text><text x="672" y="196" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="22">RESTRICCIONES</text><text x="849" y="196" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="22">FORMATO</text><text x="135" y="234" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="600" font-size="16">Quién es la IA</text><text x="312" y="234" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="600" font-size="16">Para qué sirve</text><text x="489" y="234" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="600" font-size="16">Qué debe hacer</text><text x="666" y="234" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="600" font-size="16">Qué no inventar</text><text x="843" y="234" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="600" font-size="16">Cómo responder</text><rect x="134" y="311" width="758" height="210" rx="16" fill="#fff" stroke="#295792" stroke-width="2.5"/><text x="160" y="360" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" font-size="27">Ejemplo: leer solicitudes de sala</text><text x="161" y="407" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="22">Rol: extractor de datos  ·  Contexto: registro de reservas</text><text x="161" y="448" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="22">Tarea: identificar campos  ·  Restricción: no inventar valores</text><text x="161" y="489" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="500" font-size="22">Formato: objeto JSON con nombres de campos definidos</text><text x="146" y="592" fill="#152a50" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" font-size="23">Un prompt claro facilita la extracción y las pruebas.</text></svg>